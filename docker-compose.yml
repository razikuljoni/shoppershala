# ============================================
# Shoppershala — Production Docker Compose
# ============================================
# Usage:
#   docker compose up -d          Start all services
#   docker compose up -d --build  Rebuild and start
#   docker compose down           Stop all services
#   docker compose logs -f        Follow logs
#   docker compose ps             Check service status

services:
  # ---- MongoDB ----
  mongodb:
    image: mongo:7
    container_name: shoppershala-mongodb
    restart: unless-stopped
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:-crud-express}
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - shoppershala-net

  # ---- Backend API ----
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: shoppershala-backend
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017
      DB_NAME: ${DB_NAME:-crud-express}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_secure_random_value}
      SERVICE_NAME: crud-express
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      LOG_MAX_SIZE: ${LOG_MAX_SIZE:-20m}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3000/api/v1/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - shoppershala-net

  # ---- Frontend (Nginx) ----
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: shoppershala-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-80}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - shoppershala-net

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  shoppershala-net:
    driver: bridge
